<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veloce Media — 30-Second Challenge</title><meta name="description" content="Take a quick five-question brain challenge."><style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#111;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}.page{max-width:900px;margin:auto;padding:8px 10px;min-height:100vh;display:flex;flex-direction:column}.header{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:800;letter-spacing:.08em;font-size:14px}.tag{font-size:9px;color:#999;letter-spacing:.08em}.main{flex:1;display:grid;place-items:center}.layout{width:100%;display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px;align-items:center}.ads{display:grid;gap:7px}.ad{height:65px;border:1px solid #eee;border-radius:6px;background:#fafafa;display:grid;place-items:center;color:#aaa;font-size:8px}.card{text-align:center}.kicker{font-size:9px;color:#888;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.q{font-size:clamp(24px,5vw,38px);line-height:1.05;letter-spacing:-.04em;margin:9px 0}.sub{color:#777;font-size:12px;line-height:1.4;max-width:320px;margin:auto}.choices{display:grid;gap:7px;margin:13px auto 0;max-width:320px}.choice{appearance:none;border:1px solid #ddd;background:#fff;color:#111;border-radius:6px;padding:10px;font:inherit;font-weight:700;width:100%;cursor:pointer}.choice:active{transform:scale(.99)}.progress{height:3px;background:#eee;border-radius:5px;overflow:hidden;max-width:240px;margin:9px auto}.progress i{display:block;height:100%;background:#111}.note{margin-top:7px;color:#aaa;font-size:9px}.foot{text-align:center;color:#aaa;font-size:9px;padding:6px 0}@media(max-width:600px){.page{padding:7px}.layout{grid-template-columns:1fr;gap:7px}.ads{grid-template-columns:1fr 1fr}.ad{height:48px}.main{padding:5px 0}.q{font-size:clamp(24px,8vw,35px)}}
</style></head><body><div class="page"><header class="header"><div class="logo">VELOCE MEDIA</div><div class="tag">30-SECOND CHALLENGE</div></header><main class="main"><section class="layout"><div class="ads"><div class="ad">ADVERTISEMENT</div><div class="ad">ADVERTISEMENT</div></div><div class="card" id="app"><div class="kicker">Quick challenge</div><h1 class="q">Can you get 5/5?</h1><p class="sub">Five short questions. No signup. See your score at the end.</p><div class="choices"><button class="choice" id="start">START CHALLENGE</button></div><div class="note">Fast • Free • Mobile friendly</div></div><div class="ads"><div class="ad">ADVERTISEMENT</div><div class="ad">ADVERTISEMENT</div></div></section></main><footer class="foot">© 2026 Veloce Media</footer></div>
<script>
"use strict";
const Q=[["What is 12 × 3?",["24","30","36","42"],2],["Which planet is known as the Red Planet?",["Venus","Mars","Jupiter","Mercury"],1],["How many sides does a hexagon have?",["5","7","8","6"],3],["Which ocean is the largest?",["Pacific Ocean","Atlantic Ocean","Indian Ocean","Arctic Ocean"],0],["Which gas do plants absorb from the air?",["Oxygen","Nitrogen","Carbon dioxide","Hydrogen"],2]];
let n=-1,s=0;const a=document.getElementById("app");
function show(){if(n<0){a.innerHTML='<div class="kicker">Quick challenge</div><h1 class="q">Can you get 5/5?</h1><p class="sub">Five short questions. No signup. See your score at the end.</p><div class="choices"><button class="choice" id="go">START CHALLENGE</button></div><div class="note">Fast • Free • Mobile friendly</div>';document.getElementById("go").onclick=()=>{n=0;show()};return}if(n===5){a.innerHTML='<div class="kicker">Challenge complete</div><h1 class="q">'+s+'/5</h1><p class="sub">'+(s===5?"Perfect score.":s>=3?"Great job — you got most of them.":"Good try — take it again and beat your score.")+'</p><div class="choices"><button class="choice" id="again">TRY AGAIN</button></div>';document.getElementById("again").onclick=()=>{n=-1;s=0;show()};return}const q=Q[n];a.innerHTML='<div class="kicker">Question '+(n+1)+'/5</div><div class="progress"><i style="width:'+((n+1)*20)+'%"></i></div><h1 class="q">'+q[0]+'</h1><div class="choices">'+q[1].map((v,i)=>'<button class="choice" data-i="'+i+'">'+v+'</button>').join("")+'</div>';a.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{s+=+b.dataset.i===q[2];n++;show()})}show();
</script></body></html>
